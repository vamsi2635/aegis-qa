name: AI Test Proposal (manual)

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: 'Test flow to propose or review'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository before AI work
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Print requested scope
        env:
          TEST_PURPOSE: ${{ inputs.purpose }}
        run: echo "AI test proposal requested. Run AI authoring locally in Copilot; review all changes before merging."
