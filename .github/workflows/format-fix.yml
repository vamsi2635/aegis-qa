name: Apply Prettier formatting

on:
  workflow_dispatch:
  push:
    branches: [feat/ai-qa-orchestration-foundation]
    paths: [.github/workflows/format-fix.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/ai-qa-orchestration-foundation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/ai-project-onboarding.md scripts/aegis-discover-url.mjs
      - name: Commit formatted files
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/ai-project-onboarding.md scripts/aegis-discover-url.mjs
            git commit -m "Apply Prettier formatting to URL onboarding"
            git push origin HEAD:feat/ai-qa-orchestration-foundation
          else
            echo "Files already formatted"
          fi
